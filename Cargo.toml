[package]
name = "ttjcore"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "TTJ 1.0.0 CLI and port-free JSON-RPC backend"

[dependencies]
sea-orm = { version = "1.1", default-features = false, features = ["macros", "sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "with-json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
interprocess = { version = "2.4", features = ["tokio"] }
